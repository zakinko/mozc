# CI for the BSDs.
#
# Mozc 3.34 builds with Bazel 9 only. FreeBSD has it in ports, so that job
# installs the package. NetBSD, OpenBSD and DragonFly have no Bazel 9 at all --
# pkgsrc stops at 6.4.0 and the other two have no Bazel -- so those jobs build
# it from a ported tree first and put it in /usr/local/bin. From there on all
# four take the same path.
#
# Building Bazel takes two to three hours, so the jobs that have to do it run
# on the CI branch, on request, and once a week; not on every push.
#
# rules_python publishes an interpreter for Linux, macOS and Windows only, so
# the BSDs have to be told to use the one that is installed.
name: CI for BSD

on:
  push:
    paths: &bsd_paths
      - 'src/**'
      - 'ci/bsd-bazel.sh'
      - 'ci/bsd-smoke.sh'
      - '.github/workflows/bsd.yaml'
  pull_request:
    paths: *bsd_paths
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Build in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 12288
          copyback: false
          prepare: |
            pkg install -y bazel9 openjdk21 bash python3 curl git
          run: |
            export JAVA_HOME=/usr/local/openjdk21
            sh ci/bsd-bazel.sh

  # GhostBSD と HardenedBSD は FreeBSD の userland で、pkg も FreeBSD の物が
  # 使える。同じ __FreeBSD__ の腕を、別の箱でもう一度踏む。

  ghostbsd:
    name: GhostBSD
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Build in a GhostBSD VM
        uses: vmactions/ghostbsd-vm@v1
        with:
          usesh: true
          mem: 12288
          copyback: false
          prepare: |
            pkg install -y bazel9 openjdk21 bash python3 curl git
          run: |
            export JAVA_HOME=/usr/local/openjdk21
            sh ci/bsd-bazel.sh

  hardenedbsd:
    name: HardenedBSD
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Build in a HardenedBSD VM
        uses: vmactions/hardenedbsd-vm@v1
        with:
          usesh: true
          mem: 12288
          copyback: false
          prepare: |
            # hardening.harden_rtld=1 が JDK の RUNPATH の $ORIGIN を Tainted
            # process として拒む。LD_LIBRARY_PATH では越えられない。試験の箱では外す。
            sysctl hardening.harden_rtld=0
            # 次は JVM が CodeHeap を確保できずに止まる。PaX の MPROTECT が JIT の
            # W^X を拒む (NetBSD の PaX と同じ顔)。試験の箱では両方外す。
            sysctl hardening.pax.mprotect.status=0 || true
            sysctl hardening.pax.pageexec.status=0 || true
            sysctl -a 2>/dev/null | grep 'hardening.pax' | head -12 || true
            pkg install -y bazel9 openjdk21 bash python3 curl git
          run: |
            export JAVA_HOME=/usr/local/openjdk21
            # package の java が libjli.so を見つけられない (ld-elf.so.1)。原因は
            # 箱の側で、rtld か hardening の設定。診断を出してから library の
            # 場所を直接教える。
            ldd "$JAVA_HOME/bin/java" 2>&1 | head -5 || true
            sysctl -a 2>/dev/null | grep -i 'hardening' | head -8 || true
            export LD_LIBRARY_PATH="$JAVA_HOME/lib:$JAVA_HOME/lib/server"
            "$JAVA_HOME/bin/java" -version
            sh ci/bsd-bazel.sh

  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # ゲストのディスクは runner の / から取る。使わないものを先に落として
      # おかないと、bazel の output base で足りなくなる。
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Build in a NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            set -e
            # cdn の openjdk21 は X11 の共有ライブラリに依存している。VM には
            # X の set が入っていないので、先に xbase だけ展開しておく。
            ftp -o /tmp/xbase.tar.xz "https://cdn.NetBSD.org/pub/NetBSD/NetBSD-11.0/$(uname -m)/binary/sets/xbase.tar.xz"
            tar -C / -xf /tmp/xbase.tar.xz
            /usr/sbin/pkg_add -U pkgin
            pkgin -y install openjdk21 bash zip unzip python313 go126 curl git-base
            # pkgsrc が置くのは python3.13 だけで、python3 という名前は無い。
            # mozc の build tool は python3 を呼ぶので繋いでおく。
            ln -sf /usr/pkg/bin/python3.13 /usr/pkg/bin/python3
          run: |
            export JAVA_HOME=/usr/pkg/java/openjdk21
            export PATH=/usr/pkg/bin:/usr/pkg/sbin:/usr/pkg/go126/bin:$PATH
            export BAZEL_SH=/usr/pkg/bin/bash
            # bazel を建てる側に渡す。zakinko/bazel の BSD の job と同じ。
            export EXTRA_BAZEL_ARGS="--tool_java_runtime_version=local_jdk --java_language_version=21 --tool_java_language_version=21 --extra_toolchains=//toolchain_local:netbsd_python3_toolchain,//toolchain_local:local_jdk_21_runtime,//toolchain_local:local_jdk_21_bootstrap,//toolchain_local:local_jdk_21_runtime_v,//toolchain_local:local_jdk_21_bootstrap_v --jobs=2"
            sh ci/bsd-bazel.sh

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Build in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            # unzip は他の package とも綴りが当たるので、末尾の -- で
            # 版の付かない方を名指しする。
            pkg_add -I jdk%21 bash zip unzip-- python%3 go curl git
          run: |
            export JAVA_HOME=$(ls -d /usr/local/jdk-21* | head -1)
            export BAZEL_SH=/usr/local/bin/bash
            export EXTRA_BAZEL_ARGS="--tool_java_runtime_version=local_jdk --java_language_version=21 --tool_java_language_version=21 --jobs=2"
            sh ci/bsd-bazel.sh

  dragonflybsd:
    name: DragonFly BSD
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # bazel の bootstrap がまだ通っていない。rules_go が JVM の os.name を
    # そのまま GOOS にしていて、DragonFly だけ綴りが食い違う。
    continue-on-error: true
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Build in a DragonFly BSD VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            # openjdk21 の post-install (registervm) が落ちて pkg install が
            # 途中で止まり、同じ行の git が入らなかった。道具を先に、jdk は別に。
            pkg install -y git bash zip unzip python3 go curl
            pkg install -y openjdk21 || true
            test -x /usr/local/openjdk21/bin/javac
          run: |
            export JAVA_HOME=/usr/local/openjdk21
            export BAZEL_SH=/usr/local/bin/bash
            export PATH=/usr/local/bin:/usr/local/sbin:$PATH
            export EXTRA_BAZEL_ARGS="--tool_java_runtime_version=local_jdk --java_language_version=21 --tool_java_language_version=21 --jobs=2"
            sh ci/bsd-bazel.sh
